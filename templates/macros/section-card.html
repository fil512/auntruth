{% macro section_card(title, icon, open=false) %}
<details class="disclosure-section" {% if open %}open{% endif %}>
    <summary class="disclosure-section-toggle">
        <span class="disclosure-icon">{{ icon }}</span>
        <span class="disclosure-title">{{ title }}</span>
    </summary>
    <div class="disclosure-content">
        {{ caller() }}
    </div>
</details>
{% endmacro %}
