name: Build and Deploy AuntieRuth.com

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Add permissions for GitHub Pages deployment and auto-commit
permissions:
  contents: write  # Changed from 'read' to allow committing regenerated HTML
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Install dependencies
      run: npm ci

    - name: Regenerate HTML pages from JSON data
      run: |
        echo "Regenerating all person pages from JSON data..."
        python3 PRPs/scripts/both/generate_pages.py --lineage Hagborg-Hansson --input-dir data/people/Hagborg-Hansson --output-dir docs/new/htm/L1
        python3 PRPs/scripts/both/generate_pages.py --lineage Nelson --input-dir data/people/Nelson --output-dir docs/new/htm/L2
        python3 PRPs/scripts/both/generate_pages.py --lineage Pringle-Hambley --input-dir data/people/Pringle-Hambley --output-dir docs/new/htm/L3
        python3 PRPs/scripts/both/generate_pages.py --lineage Lathrop-Lothropp --input-dir data/people/Lathrop-Lothropp --output-dir docs/new/htm/L4
        python3 PRPs/scripts/both/generate_pages.py --lineage Ward --input-dir data/people/Ward --output-dir docs/new/htm/L5
        python3 PRPs/scripts/both/generate_pages.py --lineage Selch-Weiss --input-dir data/people/Selch-Weiss --output-dir docs/new/htm/L6
        python3 PRPs/scripts/both/generate_pages.py --lineage Stebbe --input-dir data/people/Stebbe --output-dir docs/new/htm/L7
        python3 PRPs/scripts/both/generate_pages.py --lineage Lentz --input-dir data/people/Lentz --output-dir docs/new/htm/L8
        python3 PRPs/scripts/both/generate_pages.py --lineage Phoenix-Rogerson --input-dir data/people/Phoenix-Rogerson --output-dir docs/new/htm/L9
        python3 PRPs/scripts/both/generate_pages.py --lineage Other --input-dir data/people/Other --output-dir docs/new/htm/L0
        echo "HTML regeneration complete!"

    - name: Commit regenerated HTML pages
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-regenerate HTML pages from JSON data [skip ci]"
        file_pattern: 'docs/new/htm/**/*.htm'
        commit_user_name: GitHub Actions Bot
        commit_user_email: actions@github.com
        commit_author: GitHub Actions Bot <actions@github.com>

    - name: Create data directories
      run: |
        mkdir -p docs/new/js/data/lineages
        mkdir -p docs/new/js/data/indices

    - name: Build data chunks
      run: npm run build:data-chunks

    - name: Build search indices
      run: npm run build:search-indices

    - name: Optimize assets
      run: npm run build:optimize

    - name: Run tests
      run: npm test

    - name: Validate data
      run: npm run validate

    - name: Setup Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4

    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs

  # Separate deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4